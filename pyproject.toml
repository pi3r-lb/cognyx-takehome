[project]
name = "cognyx-takehome"
version = "0.1.0"
description = "Local evidence-preserving BOM and technical-note ingestion"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["dagster==1.13.22", "dagster-webserver==1.13.22"]

[project.scripts]
cognyx-takehome = "cognyx_takehome:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
